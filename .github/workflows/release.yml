name: release

# Tag v<date> (CalVer, e.g. v2026.07.26) -> build Perch.app -> GitHub release
# with a zipped bundle -> Homebrew cask bump + rice flake-pin bump. Cut tags with
# `bench release perch` from the workshop; it enforces that the tag matches
# VERSION and that everything is pushed.
#
# The app is signed with our Developer ID (hardened runtime) and notarized by
# Apple, so it opens straight from the cask/flake with no Gatekeeper prompt.
# VERSION is the single source of truth: it names the tag and is injected as
# MARKETING_VERSION at build time.
#
# Signing/notarization secrets (set once, per repo):
#   MACOS_CERT_P12       base64 of the exported "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD  the password protecting that .p12
#   NOTARY_KEY_P8        base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID        that key's Key ID
#   NOTARY_ISSUER_ID     the App Store Connect issuer ID
#   TAP_DEPLOY_KEY       write deploy key for hausfold/homebrew-tap (bump-tap)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build + publish release
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != VERSION $VERSION — bump VERSION or retag" >&2
            exit 1
          fi

      - name: Import Developer ID signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Let codesign/xcodebuild use the key non-interactively.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put our keychain first on the search list so the identity resolves.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [ -n "$IDENTITY" ]
          SIGNER_NAME="${IDENTITY#Developer ID Application: }"
          SIGNER_NAME="${SIGNER_NAME% (*}"
          echo "::add-mask::$IDENTITY"
          echo "::add-mask::$SIGNER_NAME"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build Release Perch.app (Developer ID, hardened runtime)
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Release \
            -quiet \
            -destination 'platform=macOS' \
            -derivedDataPath dd \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="88M28542LQ" \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      # Before signing, notarizing, stapling and publishing: a coverage-
      # instrumented build passes every one of those steps and still drops a
      # `default.profraw` into the working directory of every user who runs
      # `perch`. Fail here, where the only cost is a red release run.
      - name: Released binaries carry no profiling instrumentation
        run: scripts/assert-no-instrumentation.sh dd/Build/Products/Release/Perch.app

      - name: Re-sign with Developer ID (hardened runtime, clean entitlements)
        run: |
          # Explicit re-sign so notarization can't trip on an xcodebuild quirk:
          # guarantees the hardened runtime, a secure timestamp, and exactly the
          # declared entitlements (no get-task-allow, which notarization rejects).
          APP="dd/Build/Products/Release/Perch.app"
          CLI="$APP/Contents/MacOS/perch-cli"
          UPDATER="$APP/Contents/Helpers/PerchUpdater.app"
          IDENTITY="$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          # Nested code is always signed inside-out — the updater and the CLI
          # before the app that carries them. There is no app extension on the
          # Mac side: the Finder Action was removed (field test 2026-08-23,
          # #4/#5), so the only Finder door is the app's own NSServices entry,
          # which is signed with the app.
          # PerchUpdater.app, deliberately with NO entitlements and NO sandbox:
          # it is the half that puts a new build into /Applications, which the
          # sandboxed app cannot do and a child process it spawns cannot either.
          # Same team as the app it replaces — that identity is the whole
          # permission model, both for macOS (a same-team update needs no App
          # Management consent) and for us (`PerchSigning.payloadRequirement`).
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            "$UPDATER"
          # The `perch` tool, deliberately with NO entitlements: it is the
          # unsandboxed half of the handoff and reads your files as
          # you. Sandboxing it would defeat the point; the App Group it writes
          # into is addressed by path, not by entitlement.
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            "$CLI"
          codesign --force --options runtime --timestamp \
            --entitlements Perch/Config/Perch.entitlements \
            --sign "$IDENTITY" \
            "$APP"
          codesign --verify --strict --verbose=2 "$UPDATER"
          codesign --verify --strict --verbose=2 "$CLI"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarize + staple
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="dd/Build/Products/Release/Perch.app"
          echo "$NOTARY_KEY_P8" | base64 -d > "$RUNNER_TEMP/notary.p8"
          CREDS=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          # notarytool needs an archive; this zip is only for submission.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          # `submit --wait` exits 0 even when the verdict is Invalid, so check the
          # status ourselves and dump Apple's per-file reasons before failing.
          JSON="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${CREDS[@]}" --wait --output-format json)"
          echo "$JSON"
          read -r ID STATUS < <(echo "$JSON" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("id",""),d.get("status",""))')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::notarization $STATUS — Apple's log:"
            xcrun notarytool log "$ID" "${CREDS[@]}" || true
            exit 1
          fi
          # Staple the ticket onto the .app so it verifies offline.
          xcrun stapler staple "$APP"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Zip the stapled bundle
        run: |
          mkdir -p dist
          # Zip AFTER stapling — the submitted zip above has no ticket.
          ditto -c -k --sequesterRsrc --keepParent \
            "dd/Build/Products/Release/Perch.app" \
            "dist/perch-$GITHUB_REF_NAME-macos.zip"

      - name: Verify signature + notarization
        run: |
          APP="dd/Build/Products/Release/Perch.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Explicitly, as well as via --deep: Contents/Helpers IS in codesign's
          # default nested-code rule set, and this is the line that notices if
          # the updater ever moves back out of it and starts being sealed as an
          # ordinary resource.
          codesign --verify --strict --verbose=2 "$APP/Contents/Helpers/PerchUpdater.app"
          spctl --assess --type execute "$APP"
          # The exact requirement PerchUpdater checks a download against
          # (PerchSigning.payloadRequirement). A release that fails it installs
          # for nobody on the drag-install path — and would fail it *silently*,
          # as a one-click update that always refuses, so it is checked here
          # where the only cost is a red release run.
          codesign --verify -R \
            '=anchor apple generic and certificate leaf[subject.OU] = "88M28542LQ" and notarized' \
            "$APP"

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  bump-tap:
    name: bump hausfold/homebrew-tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hausfold/homebrew-tap
          # Write deploy key for the tap repo, stored as a secret here. The
          # cask's version/sha lines are CI-owned; humans never bump them.
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Point Casks/perch.rb at the new release
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/perch.zip \
            "https://github.com/hausfold/perch/releases/download/$TAG/perch-$TAG-macos.zip"
          SHA="$(sha256sum /tmp/perch.zip | cut -d' ' -f1)"
          sed -i -E \
            -e "s#^  version \".*\"#  version \"$VER\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"$SHA\"#" \
            Casks/perch.rb
          if git diff --quiet; then
            echo "cask already current"
            exit 0
          fi
          git config user.name "haus-release[bot]"
          git config user.email "haus-release@users.noreply.github.com"
          git commit -am "perch ${VER}"
          git push

  bump-flake:
    name: bump nix/release.nix
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Perch is also a flake input of the rice (hausfold/hausfold), which
      # installs the app through Nix instead of Homebrew. That flake wraps this
      # release ZIP, pinned by version + sha256 in nix/release.nix — the exact
      # same pair the cask carries. Keep the two in lockstep: rewrite the pin on
      # main so a downstream `bench ship` ripples the new release into the rice's
      # lock. The version/sha lines are CI-owned; humans never bump them.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point nix/release.nix at the new release
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/perch.zip \
            "https://github.com/hausfold/perch/releases/download/$TAG/perch-$TAG-macos.zip"
          SHA="$(sha256sum /tmp/perch.zip | cut -d' ' -f1)"
          sed -i -E \
            -e "s#^  version = \".*\";#  version = \"$VER\";#" \
            -e "s#^  sha256 = \".*\";#  sha256 = \"$SHA\";#" \
            nix/release.nix
          if git diff --quiet; then
            echo "nix/release.nix already current"
            exit 0
          fi
          git config user.name "haus-release[bot]"
          git config user.email "haus-release@users.noreply.github.com"
          git commit -am "perch ${VER} (nix release pin)"
          git push
