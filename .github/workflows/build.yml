name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  build-and-test:
    name: Native build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Analyze
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            analyze
      - name: Release build
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Deliberately NOT passing ENABLE_CODE_COVERAGE=NO to the build above:
      # the point is to prove the project-level setting still holds on a stock
      # `build`. Xcode's default is YES and it leaks past `test` into `build`,
      # an instrumented binary behaves identically, and the only symptom is a
      # `default.profraw` appearing in whatever directory `perch` was run from.
      # AGENTS.md has the why; this is the thing that notices.
      - name: Built binaries carry no profiling instrumentation
        run: |
          scripts/assert-no-instrumentation.sh \
            DerivedData/Build/Products/Release/Perch.app

      # `skill` and `doctor` are the only verbs that answer with no app running,
      # which is what makes them checkable here — and what lets them rot: no
      # other test in the suite compiles PerchCLI at all. This pins the bytes
      # `skill` prints and the exit codes both verbs promise in docs/cli.md,
      # ai/SKILL.md and --help, against the binary that would actually ship.
      - name: The shell-free verbs answer as documented
        run: |
          scripts/check-cli-surface.sh \
            DerivedData/Build/Products/Release/Perch.app/Contents/MacOS/perch-cli

  skills:
    name: Agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both failures here are invisible at runtime, which is the whole reason
      # they are a build step. A skill with broken frontmatter installs, lists
      # and is never loaded; a stale GeneratedSkills.swift means `perch skill`
      # prints something other than the file every other consumer ships.
      - name: SKILL.md guards
        run: scripts/check-skills.sh ai perch
      - name: The embedded copy matches ai/**/SKILL.md
        run: scripts/embed-skills.sh --check

  build-ios:
    name: iOS companion build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The companion shares PerchWire/ and PerchMobileCore/ with the Mac app,
      # so a change on either side can break it. Build it on every PR; the
      # signed, uploadable build lives in the testflight workflow.
      #
      # Simulator + CODE_SIGNING_ALLOWED=NO on purpose: this proves it compiles,
      # not that it runs — the App Group entitlement a real run needs is exactly
      # what unsigned builds drop.
      - name: Build PerchIOS (app + Share extension)
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme PerchIOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
