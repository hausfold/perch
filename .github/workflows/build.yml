name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  build-and-test:
    name: Native build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Analyze
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            analyze
      - name: Release build
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme Perch \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  build-ios:
    name: iOS companion build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The companion shares PerchWire/ and PerchMobileCore/ with the Mac app,
      # so a change on either side can break it. Build it on every PR; the
      # signed, uploadable build lives in the testflight workflow.
      #
      # Simulator + CODE_SIGNING_ALLOWED=NO on purpose: this proves it compiles,
      # not that it runs — the App Group entitlement a real run needs is exactly
      # what unsigned builds drop.
      - name: Build PerchIOS (app + Share extension)
        run: |
          xcodebuild \
            -project Perch.xcodeproj \
            -scheme PerchIOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
