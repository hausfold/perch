# Generated by workshop/script/issue-templates.sh — edit the generator, not this.
name: Bug report
description: Something about the shelf doesn't work
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Wrong repo? File it anyway.** hausfold is one product split across
        eight repositories, and working out which one owns your bug is our job,
        not yours — we move issues between them in one click.

        There's no telemetry in any of this, ever. This form is the only way we
        find out.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: |
        What you did, what you expected, and what you got instead. Verbatim
        beats tidy — "it said something about a lock file" is worth more
        polished than nothing.
      placeholder: |
        I …
        I expected …
        Instead …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in Perch?
      description: A guess is fine. It only routes the first look.
      options:
        - dragging files in
        - dragging files out
        - the notch — it doesn't appear, or appears wrong
        - staging, clearing or losing an item
        - Finder integration
        - iPhone or iPad
        - updating
        - installing — the zip, the cask, Gatekeeper
        - the docs
        - somewhere else, or not sure
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: |-
        perch doctor
      description: |-
        **Perch's menu bar ▸ Report a Bug… fills this in for you** — it opens this form with the version, your macOS build, your Mac model and how this copy was installed already here, and sends nothing until you press Submit. By hand: run `perch doctor` and paste its first two lines, which carry those same four facts — the rows under them name folders on your own Mac, so leave those out unless one of them is what broke. It only reads — it changes nothing, starts nothing, and sends nothing anywhere.
      render: text
    validations:
      required: false
  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: A screenshot, a log line, a hunch about what caused it. Optional — send the form without it rather than not sending it.
    validations:
      required: false
